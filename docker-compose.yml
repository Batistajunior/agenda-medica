services:
  web:
    container_name: agenda_medica_web

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      PORT: "8000"
      FLASK_DEBUG: "0"
      SECRET_KEY: "agenda-medica-docker-secret"
      DATABASE_URL: "sqlite:////app/instance/agenda_medica.db"

    volumes:
      - agenda_medica_data:/app/instance

    command:
      [
        "gunicorn",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "1",
        "--threads",
        "4",
        "--timeout",
        "120",
        "app.main:app"
      ]

volumes:
  agenda_medica_data: