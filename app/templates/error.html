{% extends "base.html" %}

{% block title %}
    {{ title }} | Agenda Médica
{% endblock %}

{% block styles %}
<style>
    .error-page {
        min-height: calc(100vh - 180px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
    }

    .error-card {
        width: 100%;
        max-width: 620px;
        padding: 48px 32px;
        text-align: center;
        border: 0;
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(33, 37, 41, 0.1);
    }

    .error-icon {
        width: 92px;
        height: 92px;
        margin: 0 auto 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        color: #dc3545;
        background-color: rgba(220, 53, 69, 0.1);
        font-size: 2.5rem;
    }

    .error-title {
        margin-bottom: 12px;
        font-weight: 700;
    }

    .error-message {
        margin-bottom: 28px;
        color: #6c757d;
        font-size: 1.05rem;
    }

    .error-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
    }

    @media (max-width: 575.98px) {
        .error-card {
            padding: 36px 22px;
        }

        .error-actions {
            flex-direction: column;
        }

        .error-actions .btn {
            width: 100%;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="error-page">
    <div class="card error-card">
        <div class="error-icon">
            {% if title == "Página não encontrada" %}
                <i class="bi bi-search"></i>
            {% else %}
                <i class="bi bi-exclamation-triangle"></i>
            {% endif %}
        </div>

        <h1 class="error-title">
            {{ title }}
        </h1>

        <p class="error-message">
            {{ message }}
        </p>

        <div class="error-actions">
            <a
                href="{{ url_for('agenda.dashboard') }}"
                class="btn btn-primary"
            >
                <i class="bi bi-house-door me-2"></i>
                Ir para o dashboard
            </a>

            <button
                type="button"
                class="btn btn-outline-secondary"
                onclick="history.back()"
            >
                <i class="bi bi-arrow-left me-2"></i>
                Voltar
            </button>
        </div>
    </div>
</div>
{% endblock %}
